name: Deploy to GitHub Pages with Storybook
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Needed for pushing to gh-pages
      - uses: actions/setup-node@v3
        with:
          node-version: 20.19.0
      - run: npm ci
      - run: npm run generate:sitemap
      - run: npm run generate:llms
      - run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
      - name: Cache busting
        run: ./scripts/cache-bust.sh
      - name: Combine builds and add CNAME
        run: |
          mkdir -p ./dist/storybook
          cp -r ./storybook-static/* ./dist/storybook/
          echo "digitaltableteur.com" > ./dist/CNAME
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
      - name: Purge Cloudflare Cache (if using Cloudflare)
        run: |
          echo "🔄 Cache should be busted due to force_orphan: true"
          echo "📅 Deployment completed at: $(date)"
