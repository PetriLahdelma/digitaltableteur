name: Data Retention Cleanup

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (no actual deletion)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  cleanup-old-data:
    name: Clean Up Old Contact Submissions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run data retention cleanup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          npx tsx scripts/cleanup-old-data.ts

      - name: Report to Slack (optional)
        if: success()
        run: |
          echo "✅ Data retention cleanup completed successfully"
          # Add Slack webhook notification here if needed

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Data retention cleanup failed"
          # Sentry will have captured the error
