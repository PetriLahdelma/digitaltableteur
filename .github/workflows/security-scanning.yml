name: Security Scanning

on:
  push:
    branches: [main, develop, "DT-*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
          cat audit-report.json

      - name: Check for high/critical vulnerabilities
        run: |
          HIGH=$(cat audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL=$(cat audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
          echo "High vulnerabilities: $HIGH"
          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical vulnerabilities"
            exit 1
          fi
          if [ "$HIGH" -gt 15 ]; then
            echo "⚠️  Found $HIGH high vulnerabilities (threshold: 15)"
            exit 1
          fi
          echo "✅ No critical vulnerabilities found"

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # Run full scan across all manifests. (No SARIF output here because it can produce
          # multiple SARIF runs, which GitHub code scanning no longer accepts in one upload.)
          args: --severity-threshold=high --all-projects

      - name: Generate Snyk SARIF (single run for upload)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # Generate SARIF for the main project only to ensure we upload a single run.
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk report
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          category: nextjs-app
          sarif_file: snyk.sarif

      - name: Monitor with Snyk
        uses: snyk/actions/node@master
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --all-projects

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "typescript"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (push)
        # Guard against null SHA on new branches or force pushes
        if: github.event_name == 'push' && github.event.before != github.sha && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (other)
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          extra_args: --only-verified

  security-headers-check:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Next.js security headers
        run: |
          if ! grep -q "Content-Security-Policy" next.config.ts; then
            echo "❌ CSP header not found in next.config.ts"
            exit 1
          fi
          if ! grep -q "Strict-Transport-Security" next.config.ts; then
            echo "❌ HSTS header not found in next.config.ts"
            exit 1
          fi
          echo "✅ Security headers configured"

      - name: Check for unsafe CSP directives
        run: |
          if grep -q "'unsafe-inline'" next.config.ts && grep -q "'unsafe-eval'" next.config.ts; then
            echo "⚠️  Warning: Both unsafe-inline and unsafe-eval detected in CSP"
            echo "Consider using nonces or removing these directives"
          fi

  env-file-check:
    name: Environment File Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for committed secrets
        run: |
          if [ -f ".env" ] || [ -f ".env.local" ]; then
            echo "❌ Environment files found in repository!"
            exit 1
          fi
          if git ls-files --error-unmatch mcp.json >/dev/null 2>&1; then
            echo "❌ mcp.json is tracked in git — use mcp.example.json and keep mcp.json local only"
            exit 1
          fi
          echo "✅ No environment files committed"

      - name: Verify .gitignore
        run: |
          if ! grep -q "\.env" .gitignore; then
            echo "❌ .env not in .gitignore"
            exit 1
          fi
          if ! grep -q "mcp\.json" .gitignore; then
            echo "❌ mcp.json not in .gitignore"
            exit 1
          fi
          echo "✅ Sensitive files properly ignored"

  typescript-security:
    name: TypeScript Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict checks
        run: npx tsc --noEmit --strict || echo "TypeScript errors found, review manually"

      - name: Check for 'any' types
        run: |
          ANY_COUNT=$(grep -r ":\s*any" --include="*.ts" --include="*.tsx" . | wc -l)
          echo "Found $ANY_COUNT uses of 'any' type"
          if [ "$ANY_COUNT" -gt 50 ]; then
            echo "⚠️  High number of 'any' types detected"
          fi

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      [
        dependency-audit,
        codeql-analysis,
        secret-scanning,
        security-headers-check,
        env-file-check,
      ]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Headers | ${{ needs.security-headers-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment Files | ${{ needs.env-file-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
