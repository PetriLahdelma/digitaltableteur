name: DS Release Gate (full)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  release-gate-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Prepare private npm read config
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: bash .github/scripts/write-npm-read-config.sh
      - run: NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-read.npmrc" npm ci
      - run: npx playwright install chromium
      - run: npm run release:gate -- --full
