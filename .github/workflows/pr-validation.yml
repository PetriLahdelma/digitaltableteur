name: PR Validation
on:
  pull_request:
jobs:
  validate:
    # Self-hosted CI farm (owned hardware) instead of metered GitHub-hosted minutes. PUBLIC repo:
    # fork PRs must NEVER run on our runners, so gate to same-repo PRs (and pushes) only — a fork
    # PR is skipped here, exactly as it never reaches the farm's secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, digitaltableteur]
    # Backstop: the farm's dashboard collector is completion-only, so a hung job is INVISIBLE
    # on the fleet board while it zombies a runner slot (GitHub's default timeout is 6h). A
    # a clean run takes ~20 min (two real-Chromium passes: theme matrix + forced-colors);
    # anything past 45 is wedged.
    timeout-minutes: 45
    steps:
      # Full history so the a11y-evidence freshness path-guard (a11y-evidence-lib.mjs
      # `isEvidenceFresh`) can run `git log <evidenceSHA>..HEAD` per component. A shallow
      # clone can't reach the evidence SHA, so freshness silently degrades to the
      # STALE_DAYS time window and never detects a source change on CI.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Prepare private npm read config
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: bash .github/scripts/write-npm-read-config.sh
      # The farm runner sets the default npm registry to a local Verdaccio
      # (npm_config_registry=http://100.77.151.86:4873/ via environment). With npm's
      # default replace-registry-host=npmjs, that rewrites every lockfile
      # registry.npmjs.org tarball URL to Verdaccio — including @digitaltableteur/*,
      # and the mirror lags newly published packages (tokens-css@0.1.2 404s there).
      # Scoped-registry pins don't help: the rewrite targets the DEFAULT registry, not
      # the scope. replace-registry-host=never disables the rewrite so npm fetches each
      # tarball from its literal lockfile URL (registry.npmjs.org, authed by the read
      # token), matching the lockfile integrity hashes and the
      # check:package-registry-resolution contract. CLI precedence beats the env var.
      - run: NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-read.npmrc" npm ci --replace-registry-host=never
      - run: npm run build:tokens
      - run: npm run check:contract-drift -- --strict
      - run: npm run check:contract-props
      - run: npm run check:story-lifecycle-tags
      - run: npm run build:zod-catalog
      - run: npm run check:generated
      - run: npm run agent:eval
      - run: npm run check:catalog-coverage
      - run: npm run lint:dt-usage
      - run: npm run lint:composition
      - run: npm run lint:dt-responsive-visibility -- --strict
      - run: npm run ds:health
      - run: npm run check:figma
      - run: npm run check:bundle-budgets
      - run: npm run check:contrast
      - run: npm run check:token-descriptions
      - run: npm run validate:components
      # Doc-semantics ratchet: fails the PR if a beta/stable component gains an a11y claim
      # proven by nothing (unverifiedOnReady over the ceiling in doc-semantics-ratchet.json).
      # Previously enforced only in .husky/pre-push, so the authoritative honesty gate never
      # ran on the farm. No browser needed — it reads the committed contracts.
      - run: npm run check:doc-semantics
      - run: npm run check:package-registry-resolution
      - run: npm run check:dogfood-ratchet
      - run: npm run check:consumers
      - run: npm run validate:agent-docs
      - run: npm run validate:translations
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run audit:rhythm:check
      - run: npm run test:stories:smoke
      # The matrix command checks every React/native Docs page before theme stories, then drives
      # real Chromium. The farm runner container doesn't ship browsers:
      # the binary lands in the persistent /home/runner/.cache volume (downloads once per browser
      # build, then no-ops), and --with-deps apt-installs the system libraries into the ephemeral
      # container each run — the same proven pattern as petritapanilahdelma's ci.yml on this farm.
      - run: npx playwright install chromium --with-deps
      - run: npm run test:stories:matrix:ci
      # Forced-colors real-browser pass (was weekly-only). Now that forced-colors
      # AT evidence is load-bearing for the a11y evidence gate, enforce the
      # forced-colors snapshot diff per PR too. Boots its own Storybook, so it is
      # a second ~10-min Chromium pass — hence timeout-minutes 45 above.
      - run: npm run test:stories:hc:ci
      # Controls-operability ratchet: drives the real Controls panel per component
      # (Human-Simulated audit) against its own Storybook boot. Raise --min in
      # audit:controls:ci as remediation batches land; end state is --min 100.
      - run: npm run audit:controls:ci
      - run: npm run test:ci
      - run: npm run build
      - run: npm run check:drift
      - name: Report CI result to dashboard collector
        if: always()   # report pass AND fail; the reporting step can never fail the gate
        env:
          CI_COLLECTOR_URL: ${{ vars.CI_COLLECTOR_URL }}
          CI_COLLECTOR_TOKEN: ${{ secrets.CI_COLLECTOR_TOKEN }}
          CI_REPORT_NODE: ${{ runner.name }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/report-ci.sh
