name: PR Validation
on:
  pull_request:
jobs:
  validate:
    # Self-hosted CI farm (owned hardware) instead of metered GitHub-hosted minutes. PUBLIC repo:
    # fork PRs must NEVER run on our runners, so gate to same-repo PRs (and pushes) only — a fork
    # PR is skipped here, exactly as it never reaches the farm's secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, digitaltableteur]
    # Backstop: the farm's dashboard collector is completion-only, so a hung job is INVISIBLE
    # on the fleet board while it zombies a runner slot (GitHub's default timeout is 6h). A
    # clean run takes ~10 min; anything past 30 is wedged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Prepare private npm read config
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: bash .github/scripts/write-npm-read-config.sh
      # TEMP DIAGNOSTIC (DT-1173): the farm redirects the @digitaltableteur scope to a
      # local Verdaccio (100.77.151.86:4873) that lags tokens-css@0.1.2. Neither a
      # userconfig scope pin nor a CLI --@scope:registry flag overrode it, so dump the
      # effective config with its source files (auth redacted) to find where it is set.
      # Remove once the redirect source is identified and the real fix lands.
      - name: Diagnose npm registry config
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-read.npmrc"
          echo "::group::key values"
          echo "registry                 = $(npm config get registry)"
          echo "@digitaltableteur:registry = $(npm config get @digitaltableteur:registry)"
          echo "replace-registry-host    = $(npm config get replace-registry-host)"
          echo "userconfig               = $(npm config get userconfig)"
          echo "globalconfig             = $(npm config get globalconfig)"
          echo "::endgroup::"
          echo "::group::npm config ls -l (with source files; npm redacts auth)"
          npm config ls -l 2>&1 | grep -iE "registry|replace-registry-host|config from" || true
          echo "::endgroup::"
          echo "::group::npm_config_* env vars (auth redacted)"
          env | grep -i "npm_config" | sed -E 's/(token|_auth[^=]*|password)=.*/\1=REDACTED/I' || echo "(none)"
          echo "::endgroup::"
          echo "::group::npmrc files (auth redacted)"
          for f in "$(npm config get globalconfig)" "$HOME/.npmrc" "./.npmrc" "$RUNNER_TEMP/npm-read.npmrc"; do
            echo "--- $f ---"
            if [ -f "$f" ]; then sed -E 's/(_authToken|_auth|_password)=.*/\1=REDACTED/' "$f"; else echo "(absent)"; fi
          done
          echo "::endgroup::"
      - run: NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-read.npmrc" npm ci --@digitaltableteur:registry=https://registry.npmjs.org/
      - run: npm run build:tokens
      - run: npm run check:contract-drift -- --strict
      - run: npm run check:contract-props
      - run: npm run build:zod-catalog
      - run: npm run check:generated
      - run: npm run agent:eval
      - run: npm run check:catalog-coverage
      - run: npm run lint:dt-usage
      - run: npm run lint:composition
      - run: npm run lint:dt-responsive-visibility -- --strict
      - run: npm run ds:health
      - run: npm run check:figma
      - run: npm run check:bundle-budgets
      - run: npm run check:contrast
      - run: npm run check:token-descriptions
      - run: npm run validate:components
      - run: npm run check:package-registry-resolution
      - run: npm run check:dogfood-ratchet
      - run: npm run check:consumers
      - run: npm run validate:agent-docs
      - run: npm run validate:translations
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run test:stories:smoke
      # The story matrix drives real Chromium. The farm runner container doesn't ship browsers:
      # the binary lands in the persistent /home/runner/.cache volume (downloads once per browser
      # build, then no-ops), and --with-deps apt-installs the system libraries into the ephemeral
      # container each run — the same proven pattern as petritapanilahdelma's ci.yml on this farm.
      - run: npx playwright install chromium --with-deps
      - run: npm run test:stories:matrix:ci
      # Controls-operability ratchet: drives the real Controls panel per component
      # (Human-Simulated audit) against its own Storybook boot. Raise --min in
      # audit:controls:ci as remediation batches land; end state is --min 100.
      - run: npm run audit:controls:ci
      - run: npm run test:ci
      - run: npm run build
      - run: npm run check:drift
      - name: Report CI result to dashboard collector
        if: always()   # report pass AND fail; the reporting step can never fail the gate
        env:
          CI_COLLECTOR_URL: ${{ vars.CI_COLLECTOR_URL }}
          CI_COLLECTOR_TOKEN: ${{ secrets.CI_COLLECTOR_TOKEN }}
          CI_REPORT_NODE: ${{ runner.name }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/report-ci.sh
