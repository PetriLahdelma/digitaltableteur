# Dependabot configuration for automated dependency scanning
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Main package.json (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group ALL minor+patch updates into two PRs; majors stay individual.
    # Previous pattern-based groups were too narrow and produced ~15
    # single-bump PRs per week.
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Security updates always get individual PRs
    versioning-strategy: "increase"
    ignore:
      # Pinned exact at 5.5.0: react-icons 5.6+ drops the Simple Icons
      # subpackage (react-icons/si) used on Work pages. Do not bump without
      # re-verifying those imports (see CLAUDE.md gotchas).
      - dependency-name: "react-icons"

  # Sanity CMS studio (still used via npm run sanity:dev)
  - package-ecosystem: "npm"
    directory: "/digitaltableteur-blog"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "sanity"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      blog-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      ci-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
