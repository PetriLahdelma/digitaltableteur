# Dependabot configuration for automated dependency scanning
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Main package.json (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # One group per dependency type, covering every update type (major
    # included). Do not split majors into their own group or restrict a
    # group with update-types: while a group PR is open, hosted Dependabot
    # marks every member as handled, so a sibling majors group (or an
    # individual major PR) is never created. No major PR was raised from
    # 2026-08-10 to 2026-10-15 because of this. A single group's open PR is
    # refreshed with all pending updates, majors included, so nothing is
    # suppressed. Upstream fix: dependabot/dependabot-core#16113, behind the
    # individual_prs_for_semver_excluded_dependencies flag (off by default
    # as of 2026-10-15); revisit splitting majors once it ships.
    groups:
      development-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    # Security updates always get individual PRs
    versioning-strategy: "increase"
    ignore:
      # Pinned exact at 5.5.0: react-icons 5.6+ drops the Simple Icons
      # subpackage (react-icons/si) used on Work pages. Do not bump without
      # re-verifying those imports (see CLAUDE.md gotchas).
      - dependency-name: "react-icons"

  # Sanity CMS studio (still used via npm run sanity:dev)
  - package-ecosystem: "npm"
    directory: "/digitaltableteur-blog"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "sanity"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # All update types in one group; see the root entry for why.
      blog-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # All update types in one group; see the root entry for why.
      ci-actions:
        patterns:
          - "*"
