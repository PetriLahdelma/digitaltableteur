# Dependabot configuration for automated dependency scanning
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Main package.json (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Minor+patch and major updates each get their own group per dependency
    # type. Majors must be grouped too: while a minor/patch group PR is open,
    # Dependabot defers to it and marks every member dependency as handled,
    # so an ungrouped major never gets its individual PR (no major PR was
    # raised between 2026-08-10 and 2026-10-15). Groups with non-overlapping
    # update-types are complementary, so a dependency belongs to both.
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-majors:
        dependency-type: "development"
        update-types:
          - "major"
      production-majors:
        dependency-type: "production"
        update-types:
          - "major"
    # Security updates always get individual PRs
    versioning-strategy: "increase"
    ignore:
      # Pinned exact at 5.5.0: react-icons 5.6+ drops the Simple Icons
      # subpackage (react-icons/si) used on Work pages. Do not bump without
      # re-verifying those imports (see CLAUDE.md gotchas).
      - dependency-name: "react-icons"

  # Sanity CMS studio (still used via npm run sanity:dev)
  - package-ecosystem: "npm"
    directory: "/digitaltableteur-blog"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "sanity"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      blog-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      blog-majors:
        patterns:
          - "*"
        update-types:
          - "major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      ci-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      ci-actions-majors:
        patterns:
          - "*"
        update-types:
          - "major"
