# Dependabot configuration for automated dependency scanning
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Main package.json (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group ALL minor+patch updates into two PRs; majors stay individual.
    # Previous pattern-based groups were too narrow and produced ~15
    # single-bump PRs per week.
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned at 5.5.0 — 5.6 drops Adobe SI icons used on work pages
      # (see CLAUDE.md gotchas). Bump only with a verified icon audit.
      - dependency-name: "react-icons"
    # Security updates always get individual PRs
    versioning-strategy: "increase"

  # Legacy nextjs-app mirror — not deployed; security scanning only via root /
  # open-pull-requests-limit: 0 disables version-update PRs for this directory.
  - package-ecosystem: "npm"
    directory: "/nextjs-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 0
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "nextjs"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Legacy Vite app — being phased out; no version-update PRs
  - package-ecosystem: "npm"
    directory: "/vite-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 0
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "vite-legacy"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Sanity CMS studio (still used via npm run sanity:dev)
  - package-ecosystem: "npm"
    directory: "/digitaltableteur-blog"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "sanity"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      blog-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "PetriLahdelma"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      ci-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
