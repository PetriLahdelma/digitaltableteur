                  - text: ", the Stylelint plugin built alongside the system, enforces the 14-step space scale in CSS declarations and Tailwind class strings. It rejects off-scale literals on padding, margin, gap, inset, and transform translations, and autofixes to the nearest valid step. The values in the spec sheet and the values in the code stay in agreement."
                - paragraph [ref=e690]:
