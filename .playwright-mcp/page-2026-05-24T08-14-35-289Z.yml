                - heading "The file AI agents read" [level=4] [ref=e355]
                - paragraph [ref=e357]:
                  - text: Every component in
                  - code [ref=e358]: "@dsharp/react"
                  - text: "ships four files: the React source, a JSON manifest, a markdown spec, and Storybook stories. The manifest is the file built for agents. It declares the component’s tier and group, its variants and slots, the stories that must exist, the tokens it is allowed to reference, and its accessibility-review state. A scaffolder generates all four files pre-wired; the team rule is that no component is ever hand-written."
                - paragraph [ref=e360]:
                  - text: "A validator runs on every push and on every CI build. It enforces parity between the CVA variant definition and the manifest, story coverage for every declared variant, and a status lifecycle that gates promotion:"
                  - code [ref=e361]: beta
                  - text: requires a Figma URL,
                  - code [ref=e362]: stable
                  - text: requires accessibility review. The contract is also what made it possible to add Rhythmguard alongside the system instead of after; once allowed tokens are listed in the manifest, the linter has a closed set to check against.
