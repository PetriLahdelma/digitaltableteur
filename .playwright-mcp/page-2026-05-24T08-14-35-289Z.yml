              - generic [ref=e117]:
                - heading "Brief" [level=3] [ref=e118]
                - paragraph [ref=e119]: "DSharp ships three products to Finnish data consultancies: DSharp Studio, a model-first desktop app maintained since 2006; PathFinder, its data-discovery sibling; and DSharp Scout, the new web product under active development. Each product had been built by its own team, with its own components, its own spacing, and its own colour tokens. Migrations between them rebuilt the same primitives. Visual polish regressed every release."
                - paragraph [ref=e120]: The brief was a shared design system. The constraints made it not a standard one. Scout was being built in parallel with the system itself. Studio was being modularised to consume the same components inside its desktop shell. A Windows target sat on the roadmap. And AI generation was expected to be a first-class consumer of the system, not an experiment on the side.
