            - region "Organisms encode the work, not the page" [ref=e455]:
              - generic [ref=e458]:
                - heading "Composition, continued" [level=4] [ref=e459]
                - heading "Organisms encode the work, not the page" [level=4] [ref=e460]
                - paragraph [ref=e462]: Scout is a task-based workbench rather than a CRUD app, which puts more weight on the organism layer than on the templates above it. LayerNav, ConceptCard, Inspector, AIToolbar, MappingGrid, ConceptDiagram, and LineageGraph carry across every modelling surface because they encode the work, not the page. A modelling template assembles a sidebar, a canvas, an inspector, and a toolbar; a refinement template assembles the same parts in a different proportion.
                - paragraph [ref=e464]:
                  - text: Inside the heavier organisms, the work split is DSharp-owned visual, library-owned mechanics. DataTable wraps TanStack Table; ConceptDiagram and LineageGraph wrap
                  - code [ref=e465]: "@xyflow/react"
                  - text: . The headless libraries handle sorting, virtualisation, node dragging, and edge routing. DSharp owns the typography, the badge composition, the archetype tints, and the focus rules. The split keeps the system small without rebuilding solved problems.
