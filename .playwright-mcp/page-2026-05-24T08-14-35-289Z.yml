                - paragraph [ref=e160]:
                  - text: The first commitment was that the brand, the rhythm, and the semantic palettes had to exist before the first button. The tokens ship as W3C DTCG JSON in
                  - code [ref=e161]: "@dsharp/tokens"
                  - text: with no runtime dependencies; Style Dictionary transforms them into CSS custom properties and typed TypeScript constants for the web in
                  - code [ref=e162]: "@dsharp/tokens-css"
                  - text: . A Windows or mobile target later becomes a sibling transform package, not a fork of the source.
                - paragraph [ref=e164]: "An early lesson came from the logo atom. Its first version bound the mark to a primitive brand token, which flattened it when the surface inverted in dark mode; DTCG primitives, by design, do not theme-switch. The fix was a dedicated semantic alias that resolves per mode, and a rule that travelled with it: brand-as-decoration uses primitives, brand-as-content uses semantics."
