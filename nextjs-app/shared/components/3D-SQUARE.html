<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Rotating Checker Cube</title>
    <style>
      :root {
        --cube-size: min(42vw, 220px);
        --tile-blue: #0079ce;
        --tile-orange: #ff5400;
        --surface: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--surface);
        perspective: 900px;
        font-family: system-ui, sans-serif;
      }

      .scene {
        width: calc(var(--cube-size) * 1.8);
        height: calc(var(--cube-size) * 1.8);
        display: grid;
        place-items: center;
      }

      .cube {
        position: relative;
        width: var(--cube-size);
        height: var(--cube-size);
        transform-style: preserve-3d;
        animation: spin 4s linear infinite;
      }

      .face {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background:
          linear-gradient(
            90deg,
            var(--tile-blue) 0 33.333%,
            var(--tile-orange) 33.333% 66.666%,
            var(--tile-blue) 66.666% 100%
          ),
          linear-gradient(
            180deg,
            transparent 0 33.333%,
            rgba(255, 255, 255, 0.45) 33.333% 66.666%,
            transparent 66.666% 100%
          );
        background-size: 100% 33.333%, 100% 100%;
        background-blend-mode: multiply;
      }

      .face::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            transparent 0 33.333%,
            currentColor 33.333% 66.666%,
            transparent 66.666% 100%
          ),
          linear-gradient(
            90deg,
            transparent 0 33.333%,
            currentColor 33.333% 66.666%,
            transparent 66.666% 100%
          );
        color: rgba(255, 255, 255, 0.45);
        mix-blend-mode: screen;
      }

      .front {
        transform: translateZ(calc(var(--cube-size) / 2));
      }

      .back {
        transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2));
      }

      .right {
        transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2));
      }

      .left {
        transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2));
      }

      .top {
        transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2));
      }

      .bottom {
        transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2));
      }

      @keyframes spin {
        from {
          transform: rotateX(-18deg) rotateY(0deg);
        }
        to {
          transform: rotateX(-18deg) rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="scene" aria-label="Animated 3D checker cube">
      <div class="cube" aria-hidden="true">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </main>
  </body>
</html>
