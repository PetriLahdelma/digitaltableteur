- region "About Petri Lahdelma":
  - heading "Petri Lahdelma" [level=3]
  - paragraph: Design systems lead
  - paragraph: Petri Lahdelma is a Finnish designer with more than 20 years between design and code. He leads a design system team at a global enterprise and laid the award-winning groundwork for the Helsinki Design System. He grew up in Turku as the son of a painter and still believes clarity matters more than decoration.
  - paragraph: "His work sits where design systems, accessibility and AI meet: component contracts that agents can read, evidence that a check actually ran and the people who still need to be in the room. He writes about it here."
  - paragraph: He studied graphic design at the University of Cumbria and holds a master's degree from Aalto University. He belongs to AIGA, IxDA and ISTD.