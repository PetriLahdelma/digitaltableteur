  - text: Design system audit
  - heading "Find where your design system is costing the team time" [level=1]
  - paragraph: Similar components behave differently. Accessibility defects return in new features. Figma and production disagree about what belongs in the system. A focused audit turns those symptoms into an inventory, severity-ranked findings and a 90-day roadmap.
  - term: Timeline
  - definition: 2 weeks
  - term: Investment
  - definition: €7–14k
  - term: Package
  - definition: Design System Audit
  - link "Book an audit":
    - /url: /contact?mode=book&package=design-system-audit
  - link "Send a question":
    - /url: /contact?mode=message&package=design-system-audit
  - paragraph: "Next available start: Q1 2027"
  - region "Use an audit when the system exists but trust is slipping":
    - heading "Use an audit when the system exists but trust is slipping" [level=2]
    - list:
      - listitem: Components look similar but behave differently across squads
      - listitem: Accessibility defects return because the pattern is not documented
      - listitem: Design and engineering disagree about what is in the system
      - listitem: Token changes break several applications because naming and ownership are unclear
  - region "What the audit reviews":
    - heading "What the audit reviews" [level=2]
    - paragraph: The work starts from the UI surfaces, components, tokens and patterns your team uses now. A representative sample is reviewed for consistency, accessibility and token use. Ownership, review and release practices are mapped alongside the inventory, so the roadmap separates quick fixes from structural work.
    - heading "Not included unless scoped separately" [level=3]
    - list:
      - listitem: A full component rebuild
      - listitem: A migration across every product
      - listitem: An accessibility conformance certificate
  - region "How the audit runs":
    - heading "How the audit runs" [level=2]
    - list:
      - listitem: Map live UI surfaces and who owns each pattern family.
      - listitem: Sample important flows for consistency, accessibility and token use.
      - listitem: Rank findings by user impact, rework cost and fix complexity.
      - listitem: Agree on minimum standards and an adoption sequence stakeholders can follow.
  - region "What you receive":
    - heading "What you receive" [level=2]
    - list:
      - listitem: An inventory of the components, tokens and patterns in use
      - listitem: Severity-ranked findings with effort estimates
      - listitem: A 90-day roadmap separating quick wins from structural fixes
      - listitem: Governance recommendations for RFCs, review and release cadence
