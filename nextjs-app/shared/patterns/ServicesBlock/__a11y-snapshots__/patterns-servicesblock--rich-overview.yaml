  - paragraph:
    - strong: "The Challenge:"
    - text: A growing e-commerce platform needed to scale its design language across web, mobile, and native apps while maintaining consistency and accessibility standards.
  - paragraph:
    - strong: "Our Approach:"
    - text: We conducted a comprehensive audit of existing patterns, interviewed stakeholders across product teams, and built a modular design system with reusable components.
