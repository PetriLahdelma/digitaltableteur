  - heading "Overview" [level=3]
  - paragraph:
    - strong: The city of Helsinki
    - text: offers hundreds of disparate digital services, from daycare applications to cultural services. Without a unified design system, each service risked looking and functioning differently, leading to user confusion.
    - strong: "The goal:"
    - text: In a multivendor environment, provide a shared design foundation so that all services share a consistent visual identity, accessible UI, and predictable user experience.