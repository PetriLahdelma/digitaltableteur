<script>
  (function () {
    try {
      var theme = localStorage.getItem("storybook-theme") || "light";
      var html = document.documentElement;
      html.classList.toggle("themeDark", theme === "dark");
      html.classList.toggle("themeHCB", theme === "hcb");
      html.classList.toggle("themeHCW", theme === "hcw");
      var style = document.createElement("style");
      var background = "#fff";
      if (theme === "dark") background = "#23272a";
      if (theme === "hcb") background = "#000";
      if (theme === "hcw") background = "#fff";
      style.innerHTML = "body{background:" + background + "}";
      document.head.appendChild(style);
    } catch (e) {}
  })();
</script>

<style>
  /* Storybook fullscreen layout safeguard: ensure top chrome perception retained */
  .fullscreenSafeArea {
    box-sizing: border-box;
    padding-top: 3.5rem; /* approximate toolbar height */
    min-height: 100vh;
  }

  @media (min-width: 1200px) {
    .fullscreenSafeArea {
      padding-inline: 2rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .fullscreenSafeArea {
      scroll-behavior: auto;
    }
  }
</style>
