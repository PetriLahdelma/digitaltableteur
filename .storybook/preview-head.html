<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>

<style>
  @font-face {
    font-family: "Satoshi";
    src: url("/fonts/Satoshi-Variable.woff2") format("woff2");
    font-weight: 300 900;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Satoshi";
    src: url("/fonts/Satoshi-VariableItalic.woff2") format("woff2");
    font-weight: 300 900;
    font-style: italic;
    font-display: swap;
  }
</style>

<script>
  (function () {
    try {
      var theme = localStorage.getItem("storybook-theme") || "light";
      var html = document.documentElement;
      html.classList.toggle("themeDark", theme === "dark");
      html.classList.toggle("themeHCB", theme === "hcb");
      html.classList.toggle("themeHCW", theme === "hcw");
      var style = document.createElement("style");
      var background = "#fff";
      if (theme === "dark") background = "#23272a";
      if (theme === "hcb") background = "#000";
      if (theme === "hcw") background = "#fff";
      style.innerHTML = "body{background:" + background + "}";
      document.head.appendChild(style);
    } catch (e) {}
  })();
</script>

<style>
  /* Storybook fullscreen layout safeguard: ensure top chrome perception retained */
  .fullscreenSafeArea {
    box-sizing: border-box;
    padding-top: 3.5rem; /* approximate toolbar height */
    min-height: 100vh;
  }

  @media (min-width: 1200px) {
    .fullscreenSafeArea {
      padding-inline: 2rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .fullscreenSafeArea {
      scroll-behavior: auto;
    }
  }
</style>
