<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Documentation vs contracts</title>
  <desc id="desc">Docs explain; contracts constrain with v1 structural and v2 semantic layers</desc>
  <rect width="720" height="220" rx="12" fill="#0f1115"/>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#e8eaed">
    <rect x="40" y="40" width="280" height="140" rx="8" fill="#1a1d24" stroke="#5c6370"/>
    <text x="180" y="72" text-anchor="middle" font-weight="700">Documentation</text>
    <text x="180" y="100" text-anchor="middle" fill="#9aa0a6">Explains intent &amp; taste</text>
    <text x="180" y="128" text-anchor="middle" fill="#9aa0a6">Human-readable prose</text>
    <rect x="400" y="40" width="280" height="140" rx="8" fill="#1a1d24" stroke="#bfff00" stroke-width="1.5"/>
    <text x="540" y="72" text-anchor="middle" font-weight="700">Contracts</text>
    <text x="540" y="100" text-anchor="middle" fill="#bfff00">v1 structural (CI today)</text>
    <text x="540" y="128" text-anchor="middle" fill="#9aa0a6">v2 semantic (migrating)</text>
    <path d="M320 110 H400" stroke="#bfff00" stroke-width="2" marker-end="url(#a)"/>
    <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#bfff00"/></marker></defs>
  </g>
</svg>
