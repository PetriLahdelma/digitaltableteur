<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Tools, harness, and skills stack</title>
  <desc id="desc">Three layers from tool surface through harness to skills and evidence</desc>
  <rect width="720" height="280" rx="12" fill="#0f1115"/>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#e8eaed">
    <rect x="80" y="24" width="560" height="56" rx="8" fill="#1a1d24" stroke="#5c6370"/>
    <text x="360" y="58" text-anchor="middle" font-weight="700">Tools  workspace (Figma, Storybook, Git, CI)</text>
    <rect x="120" y="100" width="480" height="56" rx="8" fill="#1a1d24" stroke="#bfff00" stroke-width="1.5"/>
    <text x="360" y="134" text-anchor="middle" font-weight="700">Harness  boundaries &amp; verification</text>
    <rect x="160" y="176" width="400" height="56" rx="8" fill="#1a1d24" stroke="#5c6370"/>
    <text x="360" y="210" text-anchor="middle" font-weight="700">Skills  repeatable playbooks</text>
    <rect x="200" y="248" width="320" height="24" rx="6" fill="#bfff00" fill-opacity="0.15"/>
    <text x="360" y="264" text-anchor="middle" font-size="12" fill="#bfff00">Evidence ’ reviewable change</text>
    <path d="M360 80 v20 M360 156 v20" stroke="#bfff00" stroke-width="2"/>
  </g>
</svg>
