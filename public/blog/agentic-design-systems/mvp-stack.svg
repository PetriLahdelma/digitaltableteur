<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="title desc">
  <title id="title">Minimum viable agent-ready stack</title>
  <desc id="desc">Six layers from tokens through governance</desc>
  <rect width="320" height="360" rx="12" fill="#0f1115"/>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#e8eaed">
    <rect x="40" y="20" width="240" height="44" rx="6" fill="#1a1d24" stroke="#bfff00"/><text x="160" y="48" text-anchor="middle" font-weight="600">6 Governance</text>
    <rect x="40" y="72" width="240" height="44" rx="6" fill="#1a1d24" stroke="#5c6370"/><text x="160" y="100" text-anchor="middle">5 Verification</text>
    <rect x="40" y="124" width="240" height="44" rx="6" fill="#1a1d24" stroke="#5c6370"/><text x="160" y="152" text-anchor="middle">4 Contracts</text>
    <rect x="40" y="176" width="240" height="44" rx="6" fill="#1a1d24" stroke="#5c6370"/><text x="160" y="204" text-anchor="middle">3 Components</text>
    <rect x="40" y="228" width="240" height="44" rx="6" fill="#1a1d24" stroke="#5c6370"/><text x="160" y="256" text-anchor="middle">2 Patterns</text>
    <rect x="40" y="280" width="240" height="44" rx="6" fill="#1a1d24" stroke="#5c6370"/><text x="160" y="308" text-anchor="middle">1 Tokens</text>
    <text x="160" y="340" text-anchor="middle" font-size="11" fill="#9aa0a6">Build bottom-up</text>
  </g>
</svg>
