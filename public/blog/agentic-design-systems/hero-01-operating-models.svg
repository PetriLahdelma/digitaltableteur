<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Agentic design systems need operating models</title>
  <desc id="d">Circular operating loop: intent, rules, output, evidence, better rules</desc>
  <rect width="1200" height="630" fill="#0a0c10"/>
  <text x="80" y="88" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Operating models, not more components</text>
  <text x="80" y="124" fill="#9aa0a6" font-family="system-ui,sans-serif" font-size="16">Agentic Design Systems · Part 1 of 5</text>
  <g transform="translate(600 380)">
