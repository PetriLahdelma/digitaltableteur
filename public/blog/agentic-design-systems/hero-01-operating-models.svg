    <circle r="140" fill="#12151c" stroke="#bfff00" stroke-width="2" stroke-opacity="0.35"/>
    <g font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#e8eaed">
      <text y="-175" text-anchor="middle">Intent</text>
      <text x="168" y="-52" text-anchor="middle">Rules</text>
      <text x="104" y="142" text-anchor="middle">Output</text>
      <text x="-104" y="142" text-anchor="middle">Evidence</text>
